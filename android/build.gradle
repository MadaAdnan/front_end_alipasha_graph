


allprojects {
    repositories {
        google()
        mavenCentral()
//        jcenter()
//        maven { url "https://maven.google.com" }
    }
   /* dependencies {
        // Android Gradle Plugin
        classpath "com.android.tools.build:gradle:8.6.1"

